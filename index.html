<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Startpage</title>
	<link rel="stylesheet" href="./Styles/input.css">
	<link rel="stylesheet" href="./Styles/output.css">
	<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js" defer></script>
	<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js" defer></script>
	<script src="script.js" defer></script>
</head>

<body class="text-[1.3rem] relative">
	<div class="flex justify-center items-center min-h-screen  bg-black  text-[#bababa]">
		<p id="time" class="absolute top-4 right-6 text-[#b1edff] opacity-50 text-2xl font-semibold hover:opacity-100"></p>
		<div class=" grid grid-rows-auto gap-8">
			<!-- SEARCH BAR -->
			<div class="searchbar scale-150">
				<input id="search" type="text" placeholder="Search"
					class="h-[30px] w-[30rem] text-center text-[#bababa] bg-[#0d1117] border border-[#2f2f2f] rounded-full focus:outline-none focus:border-[#54e2ff80] placeholder:text-[#4a999d] focus:placeholder-opacity-0 transition" />
			</div>

			<!-- WEB APPS LINKS -->
			<div class="text-center w-[30rem]">
				<div class="flex gap-4 scale-150 flex-wrap justify-center items-center self-center">
					<a href="https://github.com/">
						<ion-icon name="logo-github"
							class="text-[#b1edff] text-2xl justify-items-center hover:text-white hover:scale-125 opacity-65 hover:opacity-100 transition-all"></ion-icon>
					</a>
					<a href="https://reddit.com/">
						<ion-icon name="logo-reddit"
							class="text-[#b1edff] text-2xl hover:text-white hover:scale-125 opacity-65 hover:opacity-100 transition-all"></ion-icon>
					</a>
					<a href="https://chatgpt.com/">
						<ion-icon name="hardware-chip-outline"
							class="text-[#b1edff] text-2xl hover:text-white hover:scale-125 opacity-65 hover:opacity-100 transition-all"></ion-icon>
					</a>
					<a href="https://www.cloudskillsboost.google/">
						<ion-icon name="cloud-done-outline"
							class="text-[#b1edff] text-2xl hover:text-white hover:scale-125 opacity-65 hover:opacity-100 transition-all"></ion-icon>
					</a>
					<a href="https://mail.google.com/mail/u/0/#inbox">
						<ion-icon name="mail-open-outline"
							class="text-[#b1edff] text-2xl hover:text-white hover:scale-125 opacity-65 hover:opacity-100 transition-all"></ion-icon>
					</a>
					<a href="https://login.tailscale.com/admin/machines">
						<ion-icon name="apps-outline"
							class="text-[#b1edff] text-2xl hover:text-white hover:scale-125 opacity-65 hover:opacity-100 transition-all"></ion-icon>
					</a>
					<a href="https://youtube.com/">
						<ion-icon name="logo-youtube"
							class="text-[#b1edff] text-2xl hover:text-white hover:scale-125 opacity-65 hover:opacity-100 transition-all"></ion-icon>
					</a>
					<a href="https://web.whatsapp.com/">
						<ion-icon name="logo-whatsapp"
							class="text-[#b1edff] text-2xl hover:text-white hover:scale-125 opacity-65 hover:opacity-100 transition-all"></ion-icon>
					</a>
					<a href="https://huggingface.co/">
						<img src="./assets/huggingface_logo-noborder.svg" height="30px" width="30px" class="opacity-65 hover:opacity-100 hover:scale-125 transition-all">
					</a>
					<a href="https://freedium.cfd/">
						<svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="30" height="30" viewBox="0,0,256,256" class="opacity-65 hover:opacity-100 hover:scale-125 transition-all">
							<g fill="#b1edff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter"
								stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="none" font-weight="none"
								font-size="none" text-anchor="none" style="mix-blend-mode: normal">
								<g transform="scale(4,4)">
									<path
										d="M23.77344,12c-10.918,0 -11.77344,0.85444 -11.77344,11.77344v16.45312c0,10.918 0.85544,11.77344 11.77344,11.77344h16.45312c10.918,0 11.77344,-0.85444 11.77344,-11.77344v-16.45312c0,-10.919 -0.85444,-11.77344 -11.77344,-11.77344zM21.16797,16h21.66406c4.793,0 5.16797,0.37497 5.16797,5.16797v21.66406c0,4.793 -0.37597,5.16797 -5.16797,5.16797h-21.66406c-4.793,0 -5.16797,-0.37597 -5.16797,-5.16797v-21.66406c0,-4.793 0.37497,-5.16797 5.16797,-5.16797zM19.86719,22.42188v0.4375l1.60937,2.19531c0.08,0.096 0.12305,0.2168 0.12305,0.3418v13.26367c0,0.194 -0.0665,0.38416 -0.1875,0.53516l-2.41211,3.01758v0.39844h6.93359v-0.39844l-2.41406,-3.03516c-0.12,-0.15 -0.1875,-0.33925 -0.1875,-0.53125v-11.50586l7.19727,15.4707h1.33789l0.00586,-0.01758l6.19336,-15.89062v13.05469c0,0.141 -0.0543,0.27695 -0.1543,0.37695l-2.44531,2.07813v0.39844h9.5332v-0.39844l-1.57812,-2.07812c-0.1,-0.1 -0.1543,-0.235 -0.1543,-0.375v-14.5957c0,-0.141 0.0543,-0.275 0.1543,-0.375l1.57813,-1.92969v-0.4375h-7.12891l-5.00781,12.85352l-5.97852,-12.85352z">
									</path>
								</g>
							</g>	</svg>
					</a>
				</div>
			</div>

			<!-- KEY BINDINGS -->
			<div class="absolute left-4 bottom-8">
				<div class="overflow-hidden rounded-lg border border-gray-700">
					<table class="table-auto border-collapse text-cyan-700">
						<!-- HEADER -->
						<thead>
							<tr class="bg-slate-900">
								<th class="px-4 py-2 border border-gray-700 rounded">Key</th>
								<th class="px-4 py-2 border border-gray-700 rounded">Action</th>
							</tr>
						</thead>
						<tbody>
							<tr class="hover:bg-slate-800">
								<td class="px-4 py-2 border border-gray-700">c</td>
								<td class="px-4 py-2 border border-gray-700">chatGPT</td>
							</tr>
							<tr class="hover:bg-slate-800">
								<td class="px-4 py-2 border border-gray-700">g</td>
								<td class="px-4 py-2 border border-gray-700">GitHub</td>
							</tr>
							<tr class="hover:bg-slate-800">
								<td class="px-4 py-2 border border-gray-700">m</td>
								<td class="px-4 py-2 border border-gray-700">Gmail</td>
							</tr>
							<tr class="hover:bg-slate-800">
								<td class="px-4 py-2 border border-gray-700">t</td>
								<td class="px-4 py-2 border border-gray-700">TailScale</td>
							</tr>
							<tr class="hover:bg-slate-800">
								<td class="px-4 py-2 border border-gray-700">w</td>
								<td class="px-4 py-2 border border-gray-700">WhatsApp</td>
							</tr>
							<tr class="hover:bg-slate-800">
								<td class="px-4 py-2 border border-gray-700">y</td>
								<td class="px-4 py-2 border border-gray-700">YouTube</td>
							</tr>
						</tbody>
					</table>
				</div>
				</div>
		</div>
		<footer
		class=" absolute bottom-0 text-[#7e7e7e] font-semibold text-base text-center mx-auto opacity-50 hover:opacity-100 transition">
		Made with <ion-icon name="heart" class="text-red-500 text-xl"></ion-icon>, by a brainiac guy who sits the whole day in front of computers.
		</footer>
	</div>
</body>

</html>
