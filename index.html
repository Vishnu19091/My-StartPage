<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Startpage</title>
		<link rel="stylesheet" href="./Styles/color.css" />

	<body class="preload">

						<a href="https://reddit.com/">
							<ion-icon name="logo-reddit" class="text-[#b1edff] text-2xl hover:text-white hover:scale-125 transition-all"> </ion-icon>

						</a>

						<a href="https://web.whatsapp.com/">
							<ion-icon name="logo-whatsapp" class="text-[#b1edff] text-2xl hover:text-white hover:scale-125 transition-all"></ion-icon>
						</a>
					</div>
				</div>
			</div>
			<footer class="text-white font-semibold text-base ">
				Made with <ion-icon name="heart"></ion-icon>, by brainiac kid who sits all the time in front of computer.
			</footer>
